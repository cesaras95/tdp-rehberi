<!DOCTYPE html>
<!-- =============================================================
     index.html — Sitenin iskeleti (HTML)
     Benzetme: Bu dosya binanın odalarını çizer. Renkler style.css'te,
     butonların çalışması app.js'te, içerikler veri/ klasöründe.
     data-t="..." yazan yerlerdeki metinler veri/arayuz.js'den gelir
     (dil butonuna basınca Türkçe ↔ İngilizce değişir).
     ============================================================= -->
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDP Rehberi · Türk Dış Politikası</title>
  <meta name="description" content="Türk Dış Politikası tarihi, güncel gelişmeler ve politika başlıkları; Dışişleri sınavlarına hazırlananlar için quiz, bilgi kartları ve mülakat soruları. Turkish foreign policy study guide in Turkish and English.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
  <!-- UYGULAMA (PWA): telefona yüklenebilir sürüm için kimlik kartı ve simgeler -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#9b1c2c">
  <link rel="icon" href="gorseller/ikon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="gorseller/ikon-apple.png">
  <meta name="apple-mobile-web-app-title" content="TDP Rehberi">
  <!-- Arama motorları siteyi listelemesin (yalnızca davetliler için) -->
  <meta name="robots" content="noindex, nofollow">
  <!-- SAHTE KAPI: erişim listesi doluysa ve bu tarayıcı daha önce giriş yapmadıysa içeriği gizle -->
  <script src="veri/erisim.js?v=5"></script>
  <script>
    (function () {
      var kayitli = null;
      try { kayitli = localStorage.getItem("tdp-erisim"); } catch (e) {}
      if (typeof ERISIM !== "undefined" && ERISIM.length && ERISIM.indexOf(kayitli) < 0) {
        document.documentElement.classList.add("kilitli");
      }
    })();
  </script>
</head>
<body>

  <!-- GİRİŞ EKRANI (sahte kapı): yalnızca erişim listesi doluysa görünür -->
  <div class="kapi-ekran" id="kapi-ekran">
    <form class="kapi-form" id="kapi-form" autocomplete="on">
      <div class="kapi-ust">
        <span class="logo-isaret" aria-hidden="true">◈</span>
        <button class="dil-dugme" type="button" id="kapi-dil">EN</button>
      </div>
      <h1 data-t="kapiBaslik">TDP Rehberi</h1>
      <p class="giris" data-t="kapiAcik"></p>
      <label><span data-t="kapiKullanici">Kullanıcı adı</span>
        <input type="text" id="kapi-kullanici" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label><span data-t="kapiSifre">Şifre</span>
        <input type="password" id="kapi-sifre" name="password" autocomplete="current-password" required></label>
      <p class="kapi-hata" id="kapi-hata" role="alert" hidden></p>
      <button class="dugme" type="submit" data-t="kapiGir">Giriş yap</button>
    </form>
  </div>

  <!-- ÇİZİM KÜTÜPHANESİ: sitede tekrar kullanılan, bu proje için çizilmiş küre (dünya) simgesi.
       <use href="#kure"/> yazılan her yerde bu çizim görünür. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="kure" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="100" cy="100" r="62" stroke-width="2"/>
        <ellipse cx="100" cy="100" rx="24" ry="62" stroke-width="1.2" opacity=".75"/>
        <ellipse cx="100" cy="100" rx="46" ry="62" stroke-width="1.2" opacity=".55"/>
        <line x1="100" y1="38" x2="100" y2="162" stroke-width="1.2" opacity=".75"/>
        <line x1="38" y1="100" x2="162" y2="100" stroke-width="1.2" opacity=".75"/>
        <path d="M47 70 Q100 82 153 70 M47 130 Q100 118 153 130" stroke-width="1.2" opacity=".55"/>
        <!-- Diplomasi hatları: başkentleri bağlayan kesik yaylar -->
        <path d="M22 128 Q70 20 150 46" stroke-width="1.4" stroke-dasharray="3 5" opacity=".9"/>
        <path d="M60 176 Q150 150 184 78" stroke-width="1.4" stroke-dasharray="3 5" opacity=".9"/>
      </g>
      <g fill="currentColor">
        <circle cx="22" cy="128" r="4"/><circle cx="150" cy="46" r="4"/>
        <circle cx="60" cy="176" r="4"/><circle cx="184" cy="78" r="4"/>
        <circle cx="113" cy="88" r="5.5"/>
      </g>
      <circle cx="113" cy="88" r="11" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/>
    </symbol>
  </svg>

  <!-- ÜST BAŞLIK -->
  <header class="ust">
    <div class="kap ust-satir">
      <a href="#ana" class="logo">
        <span class="logo-isaret" aria-hidden="true">◈</span>
        <span>
          <strong data-t="logoAd">TDP Rehberi</strong>
          <small data-t="logoAlt">Türk Dış Politikası · sınav hazırlık</small>
        </span>
      </a>
      <div class="ust-araclar">
        <!-- ARAMA BUTONU: tüm sitede arar (kısayol: /) -->
        <button id="ara-dugme" class="ara-dugme" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-t="araDugme"></span>
        </button>
        <!-- DİL BUTONU: Türkçe ↔ İngilizce -->
        <button id="dil-dugme" class="dil-dugme" type="button"></button>
      </div>
    </div>
    <!-- MENÜ: her link bir sekmeyi açar (data-sekme ile eşleşir) -->
    <nav class="menu kap" aria-label="Menu">
      <a href="#ana" data-sekme="ana" data-t="menuAna"></a>
      <a href="#tarih" data-sekme="tarih" data-t="menuTarih"></a>
      <a href="#politikalar" data-sekme="politikalar" data-t="menuPolitikalar"></a>
      <a href="#guncel" data-sekme="guncel" data-t="menuGuncel"></a>
      <a href="#dunya" data-sekme="dunya" data-t="menuDunya"></a>
      <a href="#quiz" data-sekme="quiz" data-t="menuQuiz"></a>
      <a href="#kartlar" data-sekme="kartlar" data-t="menuKartlar"></a>
      <a href="#mulakat" data-sekme="mulakat" data-t="menuMulakat"></a>
      <a href="#yazili" data-sekme="yazili" data-t="menuYazili"></a>
      <a href="#sozluk" data-sekme="sozluk" data-t="menuSozluk"></a>
      <a href="#arsiv" data-sekme="arsiv" data-t="menuArsiv"></a>
      <a href="#sinav" data-sekme="sinav" data-t="menuSinav"></a>
    </nav>
  </header>

  <main class="kap">

    <!-- ANA SAYFA -->
    <section id="ana" class="sekme">
      <!-- KARŞILAMA (hero): solda metin, sağda 1930'lardan bir dergi kapağı -->
      <div class="hero">
        <div class="gunes" aria-hidden="true"></div>
        <div class="hero-metin">
          <p class="ust-etiket" data-t="anaUstEtiket"></p>
          <h1 data-t-html="anaBaslik"></h1>
          <p class="giris" data-t-html="anaGiris"></p>
          <div class="dugmeler">
            <a class="dugme" href="#tarih" data-t="heroDugme1"></a>
            <a class="dugme ikincil" href="#quiz" data-t="heroDugme2"></a>
          </div>
        </div>
        <figure class="cerceve hero-gorsel">
          <img src="gorseller/turquie-kamaliste-afis.webp" width="702" height="956" data-alt="altAfis" alt="">
          <figcaption data-t="capAfis"></figcaption>
        </figure>
      </div>

      <div class="ozet-izgara" id="ana-ozet"></div>

      <!-- İLERLEME: bu tarayıcıda kaydedilen quiz ve kart sonuçları -->
      <div class="kutu ilerleme" id="ana-ilerleme" hidden></div>

      <!-- KAPILAR: bölümlere görselli girişler -->
      <div class="kapilar">
        <a class="kapi" href="#tarih">
          <span class="kapi-gorsel"><img src="gorseller/turquie-kemaliste-bust.webp" width="960" height="1280" loading="lazy" data-alt="altBust" alt=""></span>
          <span class="kapi-metin"><b data-t="menuTarih"></b><small data-t="kapiTarih"></small></span>
        </a>
        <a class="kapi" href="#guncel">
          <span class="kapi-gorsel bayrakli"><img src="gorseller/bayrak.webp" width="960" height="640" loading="lazy" data-alt="altBayrak" alt=""></span>
          <span class="kapi-metin"><b data-t="menuGuncel"></b><small data-t="kapiGuncel"></small></span>
        </a>
        <a class="kapi" href="#dunya">
          <span class="kapi-gorsel kureli"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#kure"/></svg></span>
          <span class="kapi-metin"><b data-t="menuDunya"></b><small data-t="kapiDunya"></small></span>
        </a>
      </div>
      <div class="iki-sutun">
        <div class="kutu son-gelisme">
          <h2 data-t="anaSonTr"></h2>
          <div id="ana-son"></div>
          <a class="dugme ikincil" href="#guncel" data-t="tumunuGor"></a>
        </div>
        <div class="kutu son-gelisme">
          <h2 data-t="anaSonDunya"></h2>
          <div id="ana-dunya"></div>
          <a class="dugme ikincil" href="#dunya" data-t="tumunuGor"></a>
        </div>
      </div>
    </section>

    <!-- TARİH -->
    <section id="tarih" class="sekme" hidden>
      <!-- BANT: görselli bölüm başlığı -->
      <header class="bant">
        <img class="bant-gorsel" src="gorseller/turquie-kemaliste-bust.webp" width="960" height="1280" data-alt="altBust" alt="">
        <div class="bant-metin">
          <p class="ust-etiket" data-t="tarihUst"></p>
          <h1 data-t="tarihBaslik"></h1>
          <p data-t="tarihGiris"></p>
        </div>
      </header>
      <p class="kunye" data-t="capBust"></p>
      <div id="tarih-liste" class="zaman-cizelgesi"></div>
    </section>

    <!-- POLİTİKALAR -->
    <section id="politikalar" class="sekme" hidden>
      <h1 data-t="polBaslik"></h1>
      <p class="giris" data-t="polGiris"></p>
      <!-- HARİTA: ülkeye tıklayınca ilgili politika dosyası açılır -->
      <div class="kutu harita-kutu" id="harita-kutu"></div>
      <div class="filtre" id="politika-filtre">
        <button class="cip aktif" data-oncelik="hepsi" data-t="filtreHepsi"></button>
        <button class="cip" data-oncelik="yuksek" data-t="filtreYuksek"></button>
        <button class="cip" data-oncelik="orta" data-t="filtreOrta"></button>
        <button class="cip" data-oncelik="dusuk" data-t="filtreDusuk"></button>
      </div>
      <div id="politika-liste" class="kart-izgara"></div>
      <!-- Bir başlığa tıklanınca ayrıntılı "dosya" burada açılır -->
      <div id="politika-dosya" hidden></div>
    </section>

    <!-- TÜRKİYE GÜNDEMİ -->
    <section id="guncel" class="sekme" hidden>
      <header class="bant bant-bayrak">
        <img class="bant-gorsel" src="gorseller/bayrak.webp" width="960" height="640" data-alt="altBayrak" alt="">
        <div class="bant-metin">
          <p class="ust-etiket" data-t="guncelUst"></p>
          <h1 data-t="guncelBaslik"></h1>
          <p id="guncel-giris"></p>
        </div>
      </header>
      <!-- Robotun her gün doldurduğu kutu (veri/otomatik.js) -->
      <div class="kutu otomatik" id="otomatik-turkiye" hidden></div>
      <div class="kutu yaklasan">
        <h2 data-t="yaklasan"></h2>
        <ul id="yaklasan-liste"></ul>
      </div>
      <div id="duyuru-liste"></div>
    </section>

    <!-- DÜNYA GÜNDEMİ (yeni sekme) -->
    <section id="dunya" class="sekme" hidden>
      <header class="bant bant-kure">
        <svg class="bant-svg" viewBox="0 0 200 200" aria-hidden="true"><use href="#kure"/></svg>
        <div class="bant-metin">
          <p class="ust-etiket" data-t="dunyaUst"></p>
          <h1 data-t="dunyaBaslik"></h1>
          <p id="dunya-giris"></p>
        </div>
      </header>
      <div class="kutu otomatik" id="otomatik-dunya" hidden></div>
      <div class="kutu yaklasan">
        <h2 data-t="dunyaTakvim"></h2>
        <ul id="dunya-takvim"></ul>
      </div>
      <div class="filtre" id="dunya-filtre"></div>
      <div id="dunya-liste"></div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="sekme" hidden>
      <h1 data-t="quizBaslik"></h1>
      <div class="filtre" id="quiz-filtre"></div>
      <div id="quiz-alan" class="kutu quiz-kutu"></div>
    </section>

    <!-- BİLGİ KARTLARI -->
    <section id="kartlar" class="sekme" hidden>
      <h1 data-t="kartBaslik"></h1>
      <p class="giris" data-t="kartGiris"></p>
      <div class="cevir-kap">
        <button id="kart" class="cevir-kart" aria-live="polite">
          <span class="yuz on" id="kart-on"></span>
          <span class="yuz arka" id="kart-arka"></span>
        </button>
      </div>
      <div class="kart-kontrol">
        <button class="dugme ikincil" id="kart-geri" data-t="onceki"></button>
        <span id="kart-sayac"></span>
        <button class="dugme ikincil" id="kart-ileri" data-t="sonraki"></button>
      </div>
      <div class="dugmeler ortala-flex">
        <button class="dugme ikincil" id="kart-tekrar" data-t="kartTekrar"></button>
        <button class="dugme" id="kart-bildim" data-t="kartBildim"></button>
      </div>
      <div class="ortala">
        <label class="secim"><input type="checkbox" id="kart-sadece"> <span data-t="kartSadece"></span></label>
        <button class="dugme metin" id="kart-karistir" data-t="karistir"></button>
      </div>
    </section>

    <!-- MÜLAKAT ANTRENMANI: hazırlık, tek soru, jüri simülasyonu, gelişim -->
    <section id="mulakat" class="sekme" hidden>
      <h1 data-t="mulakatBaslik"></h1>
      <p class="giris" data-t="mulakatGiris"></p>
      <div class="filtre" id="mulakat-mod">
        <button class="cip aktif" data-m-mod="hazirlik" data-t="mModHazirlik"></button>
        <button class="cip" data-m-mod="tek" data-t="mModTek"></button>
        <button class="cip" data-m-mod="juri" data-t="mModJuri"></button>
        <button class="cip" data-m-mod="gelisim" data-t="mModGelisim"></button>
      </div>
      <div id="mulakat-alan"></div>
    </section>

    <!-- YAZILI PRATİK: kompozisyon ve çeviri -->
    <section id="yazili" class="sekme" hidden>
      <h1 data-t="yaziliBaslik"></h1>
      <p class="giris" data-t="yaziliGiris"></p>
      <div class="filtre" id="yazili-mod">
        <button class="cip aktif" data-mod="kompozisyon" data-t="modKompozisyon"></button>
        <button class="cip" data-mod="ceviri" data-t="modCeviri"></button>
      </div>
      <div id="yazili-alan"></div>
    </section>

    <!-- SÖZLÜK: Bakanlık terminoloji listelerinden aranabilir sözlük -->
    <section id="sozluk" class="sekme" hidden>
      <h1 data-t="sozlukBaslik"></h1>
      <p class="giris" data-t="sozlukGiris"></p>
      <div class="arama-kutu">
        <input type="search" id="sozluk-ara" autocomplete="off" data-ph="sozlukAra">
      </div>
      <div class="filtre" id="sozluk-filtre"></div>
      <!-- HARF ÇUBUĞU: arama yokken alfabetik listede harfe atlamak için -->
      <div class="harf-cubugu" id="sozluk-harfler" hidden></div>
      <p class="pol-bolge" id="sozluk-durum"></p>
      <div id="sozluk-sonuc" class="sozluk-liste"></div>
    </section>

    <!-- ÇIKMIŞ SORULAR: konu düzeyinde arşiv ve tema sıklığı grafiği -->
    <section id="arsiv" class="sekme" hidden>
      <h1 data-t="arsivBaslik"></h1>
      <p class="giris" data-t="arsivGiris"></p>
      <div class="filtre" id="arsiv-sinav"></div>
      <div class="filtre" id="arsiv-bolum"></div>
      <div class="kutu arsiv-grafik" id="arsiv-grafik"></div>
      <div class="arsiv-ust"><label class="secim-satir"><span data-t="arsivTema"></span>: <select id="arsiv-tema"></select></label><span class="pol-bolge" id="arsiv-sayi"></span></div>
      <div id="arsiv-liste"></div>
      <p class="kunye" id="arsiv-kaynak"></p>
    </section>

    <!-- SINAV REHBERİ -->
    <section id="sinav" class="sekme" hidden>
      <h1 data-t="sinavBaslik"></h1>
      <div id="sinav-alan"></div>
    </section>

  </main>

  <!-- ARAMA PANELİ: üstteki Ara butonuyla açılır -->
  <div class="ara-panel" id="ara-panel" role="dialog" aria-modal="true" aria-labelledby="ara-baslik" hidden>
    <div class="ara-ic">
      <div class="ara-satir">
        <h2 id="ara-baslik" class="gizli-baslik" data-t="araBaslik"></h2>
        <input type="search" id="ara-girdi" autocomplete="off" data-ph="araPh">
        <button class="dugme metin" id="ara-kapat" type="button" data-t="araKapat"></button>
      </div>
      <p class="pol-bolge" id="ara-durum"></p>
      <div id="ara-sonuc" class="ara-sonuc"></div>
    </div>
  </div>

  <!-- Harita ve grafik için ortak açıklama balonu (tooltip) -->
  <div class="balon" id="balon" role="tooltip" hidden></div>

  <!-- ALT BİLGİ: sitenin resmî olmadığını açıkça belirtiyoruz -->
  <footer class="alt">
    <div class="kap"><p data-t-html="altBilgi"></p>
    <div class="kur-kutu" id="kur-kutu" hidden><p data-t="kurAcik"></p><button class="dugme" id="kur-dugme" type="button" data-t="kurDugme"></button><p class="pol-bolge" id="kur-ios" data-t="kurIos" hidden></p></div><p class="kunye" data-t="altKunye"></p><p><button class="dugme metin" id="cikis-dugme" type="button" data-t="kapiCikis" hidden></button></p></div>
  </footer>

  <!-- ÖNCE VERİLER, SONRA UYGULAMA (sıra önemli!) -->
  <script src="veri/arayuz.js"></script>
  <script src="veri/tarih.js"></script>
  <script src="veri/politikalar.js"></script>
  <script src="veri/duyurular.js"></script>
  <script src="veri/dunya.js"></script>
  <script src="veri/sorular.js"></script>
  <script src="veri/mulakat.js"></script>
  <script src="veri/quiz_ek.js"></script>
  <script src="veri/arsiv.js"></script>
  <script src="veri/harita.js"></script>
  <script src="veri/sinav.js"></script>
  <script src="veri/otomatik.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
